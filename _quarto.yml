project:
  type: website
  output-dir: _site
  # Renderiza SO os .qmd. Os .md da raiz sao documentos de trabalho
  # (claude-instructions.md, PROGRESS.md, notas do healthbR), nao paginas do
  # site — e o claude-instructions.md tem blocos ```{r} de exemplo, que faziam
  # o render inteiro abortar com "You must use the .qmd extension for documents
  # with executable code".
  render:
    - "**/*.qmd"
    # Paineis fora do render: `dashboard/imunizacao.qmd` e um modulo INACABADO
    # (ver PROGRESS.md) e aborta com "objeto 'desagregacao' nao encontrado";
    # `dashboard/vigitel` depende de um .rds gitignored que so existe na
    # maquina do autor. Enquanto isso for verdade, o site nao constroi em
    # lugar nenhum se eles entrarem. Reincluir quando os dados agregados
    # forem versionados.
    - "!dashboard/**"

# Babelquarto multilingual configuration
babelquarto:
  languagecodes:
    - name: pt
      text: "Português"
    - name: en
      text: "English"
  mainlanguage: "pt"
  languages: ["en"]

# As chaves por idioma ficam no NÍVEL RAIZ, não dentro de `babelquarto:` —
# foi assim que o pacote as gerou quando consultado, e com elas aninhadas o
# seletor de idioma não era emitido. Conferido em 31/08/2026 contra um projeto
# descartável montado por `register_main_language()`/`register_further_languages()`.
lang: pt
title-en: "Sidney Bissoli"
description-en: "Psychologist | Public Health Researcher | Financial Markets Analyst | Data Scientist"

website:
  title: "Sidney Bissoli"
  # Domínio próprio desde 02/09/2026 (Worker com assets, wrangler.jsonc). O
  # valor entra no sitemap, no canonical e nos links do seletor de idioma —
  # é o endereço que o buscador considera oficial.
  site-url: "https://sidneybissoli.com"
  navbar:
    background: light
    pinned: true
    # collapse: true (padrao) porque sao sete itens: em tela estreita
    # eles viram menu sanfona em vez de estourar a linha.
    collapse: true
    left:
      # Os tres produtos vem primeiro e no primeiro nivel, por decisao do Sidney
      # em 31/08/2026: menu suspenso esconderia justamente o que se quer que o
      # visitante descubra. Custa um item a mais na barra; paga em descoberta.
      - href: tools/index.qmd
        text: Servidores MCP
      - href: packages/index.qmd
        text: Pacotes R
      # "Paineis" (dashboard/index.qmd) fica FORA da barra enquanto
      # `dashboard/**` estiver fora do render (ver `project.render` acima):
      # com o item, a barra apontava para o .qmd cru e o visitante recebia o
      # fonte em vez de uma pagina (medido em 01/09/2026 antes de publicar).
      # Reincluir junto com a reinclusao do render dos paineis.
      - href: projects/index.qmd
        text: Projetos
      - href: blog/index.qmd
        text: Escritos
      - href: research/index.qmd
        text: Publicações
      - href: about.qmd
        text: Sobre mim
    right:
      - icon: linkedin
        href: "https://linkedin.com/in/sidneybissoli/"
        aria-label: LinkedIn
      - icon: github
        href: "https://github.com/SidneyBissoli"
        aria-label: GitHub
      - icon: envelope
        href: "mailto:sbissoli76@gmail.com"
        aria-label: Email
  page-footer:
    center: |
      © 2025 Sidney Bissoli · Feito com [Quarto](https://quarto.org/)
    background: light

format:
  html:
    theme:
      light: cosmo
    fontsize: 1.1em
    linestretch: 1.6
    toc: false
    page-layout: full
    css: styles.css
